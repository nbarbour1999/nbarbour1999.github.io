<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">
  <head>
    {%- include head.html -%}
    <link rel="icon" type="image/png" href="{{ '/assets/icon.png' | relative_url }}">
  </head>
  

  <body style="background-image: url('{{ '/assets/background.jpg' | relative_url }}'); background-size: cover; background-position: center; 
  background-repeat: no-repeat; backdrop-filter: blur(10px);">

    {%- include header.html -%}

    <main class="page-content" aria-label="Content">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>

    {%- include footer.html -%}

  </body>

</html>
